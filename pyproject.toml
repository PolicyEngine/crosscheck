[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crosscheck"
version = "0.1.0"
description = "A shared row format for comparing tax-benefit models case by case"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "PolicyEngine" }]
dependencies = [
    "pyarrow>=14",
    "jsonschema>=4.18",
]

[project.scripts]
crosscheck = "crosscheck.cli:main"

[project.urls]
Repository = "https://github.com/PolicyEngine/crosscheck"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crosscheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: fetches pinned public files from GitHub",
    "realdata: reads a local checkout named by an environment variable",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
